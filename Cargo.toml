[package]
name = "meow-paw"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
desktop = ["dep:gpui-kit", "dep:zbus"]
visual-test = ["desktop", "gpui-kit/test-support"]

[[bin]]
name = "meow-paw"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
gpui-kit = { version = "=0.11.0", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "=2.0.0"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls", "gzip"] }
url = "2"
getrandom = "0.4"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5.19", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "tray_test_watcher"
required-features = ["visual-test"]
