[package]
name = "meow-paw"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "=2.0.0"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
getrandom = "0.4"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
