    <path id="sole" d="M52 137C40 126 34 111 38 97C42 81 57 72 71 76C70 58 80 44 95 42C108 40 120 47 126 57C133 43 146 37 160 41C176 45 185 60 182 76C196 72 211 80 216 94C222 110 216 126 204 138C215 151 214 172 205 186C193 206 165 218 131 219C95 220 63 208 51 187C41 171 41 151 52 137Z"/>
    <path id="main-pad" d="M129 114C142 113 147 125 157 131C167 137 180 140 185 152C191 168 181 185 163 189C152 192 142 186 130 186C117 186 109 193 95 190C78 186 67 171 73 154C78 141 92 137 104 131C113 126 118 115 129 114Z"/>
