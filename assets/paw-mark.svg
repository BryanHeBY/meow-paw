<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Meow Paw — a golden cat paw with plush toe beans</title>
  <defs>
    <clipPath id="tile"><rect x="3" y="3" width="250" height="250" rx="59"/></clipPath>
    <linearGradient id="sky" x1=".20" y1="0" x2=".7" y2="1">
      <stop stop-color="#50DFFF"/><stop offset=".35" stop-color="#12BDF6"/><stop offset=".84" stop-color="#047EE2"/><stop offset="1" stop-color="#1856BF"/>
    </linearGradient>
    <radialGradient id="body" cx=".32" cy=".19" r=".92">
